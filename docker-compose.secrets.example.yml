# Optional production-style override that reads credentials from Docker secret files.
#
# Usage:
#   mkdir -p secrets
#   printf '%s' 'your_username' > secrets/smt_username
#   printf '%s' 'your_password' > secrets/smt_password
#   printf '%s' 'your_esiid' > secrets/smt_esiid
#   chmod 600 secrets/smt_*
#   docker compose -f docker-compose.yml -f docker-compose.secrets.example.yml up -d

services:
  web:
    env_file: []
    environment:
      SMT_PROJECT_ROOT: /app
      SMT_DASHBOARD_SOURCE: sqlite
      SMT_DASHBOARD_FALLBACK_SOURCES: csv
    secrets:
      - smt_username
      - smt_password
      - smt_esiid

  scheduler:
    env_file: []
    environment:
      SMT_PROJECT_ROOT: /app
      SMT_USERNAME_FILE: /run/secrets/smt_username
      SMT_PASSWORD_FILE: /run/secrets/smt_password
      SMT_ESIID_FILE: /run/secrets/smt_esiid
    secrets:
      - smt_username
      - smt_password
      - smt_esiid

secrets:
  smt_username:
    file: ./secrets/smt_username
  smt_password:
    file: ./secrets/smt_password
  smt_esiid:
    file: ./secrets/smt_esiid
