services:
  web:
    build: .
    image: smart-meter-texas:local
    env_file:
      - .env
    environment:
      SMT_PROJECT_ROOT: /app
      SMT_DASHBOARD_SOURCE: sqlite
    ports:
      - "8501:8501"
    volumes:
      - smt_data:/app/data
      - smt_logs:/app/logs
    restart: unless-stopped

  scheduler:
    image: smart-meter-texas:local
    build: .
    env_file:
      - .env
    environment:
      SMT_PROJECT_ROOT: /app
    command: ["smt-scheduler"]
    volumes:
      - smt_data:/app/data
      - smt_logs:/app/logs
    restart: unless-stopped

volumes:
  smt_data:
  smt_logs:
