services:
  web:
    build: .
    image: smart-meter-texas:local
    env_file:
      - .env
    environment:
      SMT_PROJECT_ROOT: /app
      SMT_DASHBOARD_SOURCE: sqlite
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  scheduler:
    image: smart-meter-texas:local
    build: .
    env_file:
      - .env
    environment:
      SMT_PROJECT_ROOT: /app
    command: ["smt-scheduler"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
